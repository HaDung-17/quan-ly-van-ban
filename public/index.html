<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Tra Cứu Văn Bản - Sư Đoàn 307</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .preview-container {
      position: relative;
      width: 100%;
      height: 75vh;
    }
    .preview-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-red-800 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold uppercase tracking-wide">Sư Đoàn 307 - Văn Bản</h1>
      <button id="authBtn" onclick="toggleRole()" class="bg-yellow-500 hover:bg-yellow-600 text-red-950 font-bold px-3 py-1.5 rounded-lg text-sm transition">
        Quyền: User (Bấm để đổi Admin)
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-3 md:p-6 space-y-6">

    <!-- Thanh Tìm Kiếm Thông Minh -->
    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
      <div class="relative">
        <input type="text" id="searchInput" oninput="handleSearch()" 
               placeholder="Nhập từ khóa (Ví dụ: 390, 03/9, Nghị quyết, Đảng ủy...)" 
               class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-800 text-base">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400 text-lg"></i>
      </div>
    </div>

    <!-- Form Thêm/Sửa Tài Liệu (Chỉ hiển thị khi là Admin) -->
    <div id="adminFormCard" class="hidden bg-white p-5 rounded-xl shadow-md border-l-4 border-red-800 space-y-4">
      <h2 id="formTitle" class="text-lg font-bold text-red-800">Đăng Văn Bản Mới</h2>
      <input type="hidden" id="editDocId">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" id="docTitle" placeholder="Tiêu đề văn bản" class="p-2.5 border rounded-lg w-full">
        <input type="text" id="docNumber" placeholder="Số/Ký hiệu (VD: 390-NQ/ĐU)" class="p-2.5 border rounded-lg w-full">
        <input type="text" id="effectiveDate" placeholder="Ngày hiệu lực (VD: 03/9/2026)" class="p-2.5 border rounded-lg w-full">
        <input type="text" id="issuer" placeholder="Cơ quan ban hành (VD: Đảng uỷ PTM)" class="p-2.5 border rounded-lg w-full">
        <input type="text" id="thumbnail" placeholder="Link ảnh đại diện (Tùy chọn)" class="p-2.5 border rounded-lg w-full md:col-span-2">
        <input type="text" id="fileUrl" placeholder="Link tệp văn bản (PDF / Google Drive view link)" class="p-2.5 border rounded-lg w-full md:col-span-2">
        <textarea id="summary" placeholder="Mô tả tóm tắt nội dung văn bản..." class="p-2.5 border rounded-lg w-full md:col-span-2 h-20"></textarea>
      </div>
      <div class="flex gap-2">
        <button onclick="saveDocument()" class="bg-red-800 text-white font-bold px-5 py-2 rounded-lg hover:bg-red-900 transition">Lưu Văn Bản</button>
        <button onclick="resetForm()" class="bg-gray-400 text-white font-bold px-4 py-2 rounded-lg hover:bg-gray-500 transition">Hủy</button>
      </div>
    </div>

    <!-- Danh sách văn bản dạng Thẻ Báo Chí (Tối ưu tuyệt đối trên Điện thoại) -->
    <div id="documentList" class="space-y-4"></div>

  </main>

  <!-- Modal Xem Tệp Văn Bản (Full màn hình Mobile) -->
  <div id="fileModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-2 md:p-6">
    <div class="bg-white w-full max-w-5xl rounded-xl overflow-hidden flex flex-col h-[90vh]">
      <div class="p-4 bg-red-800 text-white flex justify-between items-center">
        <h3 id="modalDocTitle" class="font-bold truncate pr-4 text-sm md:text-base">Xem Văn Bản</h3>
        <button onclick="closeModal()" class="text-white hover:text-gray-300 font-bold text-xl px-2">&times;</button>
      </div>
      <div class="flex-1 bg-gray-200 preview-container">
        <iframe id="fileIframe" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    let isAdmin = false;
    let searchTimeout = null;

    function toggleRole() {
      isAdmin = !isAdmin;
      document.getElementById('authBtn').innerText = isAdmin ? 'Quyền: ADMIN (Đang bật)' : 'Quyền: User (Bấm để đổi Admin)';
      document.getElementById('adminFormCard').classList.toggle('hidden', !isAdmin);
      fetchDocuments();
    }

    async function fetchDocuments(keyword = '') {
      const res = await fetch(`/api/documents?q=${encodeURIComponent(keyword)}`);
      const result = await res.json();
      if(result.success) renderDocuments(result.data);
    }

    function renderDocuments(docs) {
      const container = document.getElementById('documentList');
      if(docs.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500 font-medium">Không tìm thấy văn bản phù hợp.</div>`;
        return;
      }

      container.innerHTML = docs.map(doc => `
        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col md:flex-row hover:shadow-lg transition">
          <div class="md:w-48 h-40 md:h-auto bg-gray-100 flex-shrink-0 relative overflow-hidden flex items-center justify-center">
            ${doc.thumbnail 
              ? `<img src="${doc.thumbnail}" class="w-full h-full object-cover" alt="Preview">` 
              : `<div class="text-center text-red-800 p-4"><i class="fa-solid fa-file-pdf text-5xl mb-1"></i><p class="text-xs font-semibold">VĂN BẢN</p></div>`}
          </div>
          
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <div class="flex flex-wrap gap-2 text-xs mb-2">
                <span class="bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded">${doc.docNumber || 'Không số'}</span>
                <span class="bg-blue-100 text-blue-800 font-medium px-2 py-0.5 rounded"><i class="fa-regular fa-calendar-check mr-1"></i>${doc.effectiveDate || 'N/A'}</span>
                <span class="bg-gray-100 text-gray-700 font-medium px-2 py-0.5 rounded"><i class="fa-solid fa-building mr-1"></i>${doc.issuer || 'Nội bộ'}</span>
              </div>
              <h3 class="font-bold text-gray-900 text-base md:text-lg leading-snug mb-2">${doc.title}</h3>
              <p class="text-gray-600 text-sm line-clamp-2">${doc.summary || 'Chưa có tóm tắt nội dung.'}</p>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
              <button onclick="openFile('${doc.fileUrl}', '${escapeHtml(doc.title)}')" class="bg-red-800 hover:bg-red-900 text-white font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-eye"></i> Xem tệp
              </button>
              
              ${isAdmin ? `
                <div class="flex gap-2">
                  <button onclick="editDoc('${doc._id}', '${escapeHtml(doc.title)}', '${escapeHtml(doc.docNumber)}', '${escapeHtml(doc.effectiveDate)}', '${escapeHtml(doc.issuer)}', '${escapeHtml(doc.thumbnail || '')}', '${escapeHtml(doc.fileUrl)}', '${escapeHtml(doc.summary || '')}')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition">
                    <i class="fa-solid fa-pen"></i> Sửa
                  </button>
                  <button onclick="deleteDoc('${doc._id}')" class="bg-gray-600 hover:bg-red-600 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition">
                    <i class="fa-solid fa-trash"></i> Xóa
                  </button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const val = document.getElementById('searchInput').value;
        fetchDocuments(val);
      }, 300);
    }

    async function saveDocument() {
      const id = document.getElementById('editDocId').value;
      const payload = {
        title: document.getElementById('docTitle').value,
        docNumber: document.getElementById('docNumber').value,
        effectiveDate: document.getElementById('effectiveDate').value,
        issuer: document.getElementById('issuer').value,
        thumbnail: document.getElementById('thumbnail').value,
        fileUrl: document.getElementById('fileUrl').value,
        summary: document.getElementById('summary').value,
      };

      const url = id ? `/api/documents/${id}` : '/api/documents';
      const method = id ? 'PUT' : 'POST';

      await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      resetForm();
      fetchDocuments();
    }

    function editDoc(id, title, docNumber, effectiveDate, issuer, thumbnail, fileUrl, summary) {
      document.getElementById('editDocId').value = id;
      document.getElementById('docTitle').value = title;
      document.getElementById('docNumber').value = docNumber;
      document.getElementById('effectiveDate').value = effectiveDate;
      document.getElementById('issuer').value = issuer;
      document.getElementById('thumbnail').value = thumbnail;
      document.getElementById('fileUrl').value = fileUrl;
      document.getElementById('summary').value = summary;
      
      document.getElementById('formTitle').innerText = "Chỉnh Sửa Văn Bản";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteDoc(id) {
      if(confirm('Anh có chắc muốn xóa văn bản này?')) {
        await fetch(`/api/documents/${id}`, { method: 'DELETE' });
        fetchDocuments();
      }
    }

    function resetForm() {
      document.getElementById('editDocId').value = '';
      document.getElementById('docTitle').value = '';
      document.getElementById('docNumber').value = '';
      document.getElementById('effectiveDate').value = '';
      document.getElementById('issuer').value = '';
      document.getElementById('thumbnail').value = '';
      document.getElementById('fileUrl').value = '';
      document.getElementById('summary').value = '';
      document.getElementById('formTitle').innerText = "Đăng Văn Bản Mới";
    }

    function openFile(url, title) {
      document.getElementById('modalDocTitle').innerText = title;
      document.getElementById('fileIframe').src = url;
      document.getElementById('fileModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('fileModal').classList.add('hidden');
      document.getElementById('fileIframe').src = '';
    }

    function escapeHtml(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    fetchDocuments();
  </script>
</body>
</html>
