<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SƯ ĐOÀN 307 - HỆ THỐNG QUẢN LÝ VĂN BẢN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #8b0000; color: white; }
        .nav-main-tabs .nav-link { color: #333; font-weight: 600; border-radius: 0; }
        .nav-main-tabs .nav-link.active { background-color: #8b0000; color: white !important; border-color: #8b0000; }
        .card-doc { transition: transform 0.2s; border: none; }
        .card-doc:hover { transform: translateY(-3px); }
        .thumb-img { height: 160px; object-fit: cover; }
        .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-custom shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="#">
                <i class="fa-solid fa-star text-warning me-2 fs-4"></i> SƯ ĐOÀN 307
            </a>
            <div id="authButtons"></div>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- LEVEL 1 TABS -->
        <ul class="nav nav-tabs nav-main-tabs mb-3 border-bottom-0" id="level1Tabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchLevel1('HOME')"><i class="fa-solid fa-house me-1"></i>Trang chủ</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('BQP')"><i class="fa-solid fa-star me-1"></i>Văn bản Bộ Quốc Phòng</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('QK')"><i class="fa-solid fa-shield-halved me-1"></i>Văn bản Quân Khu</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('SD')"><i class="fa-solid fa-flag me-1"></i>Văn bản Sư đoàn</button>
            </li>
        </ul>

        <!-- LEVEL 2 & 3 CONTAINERS -->
        <div id="level2Container" class="mb-2"></div>
        <div id="level3Container" class="mb-4"></div>

        <!-- SEARCH BAR -->
        <div class="card p-3 shadow-sm mb-4 border-0">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Nhập từ khóa (Ví dụ: Nghị quyết 390, PTM...)" onkeyup="if(event.key === 'Enter') executeSearch()">
                <button class="btn btn-danger fw-bold px-4" onclick="executeSearch()">Tìm kiếm</button>
            </div>
        </div>

        <!-- DOCUMENT GRID -->
        <div class="row g-3" id="documentGrid"></div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const structure = {
            BQP: {
                BTTM: "Văn bản Bộ Tổng Tham mưu",
                TCCT: "Văn bản Tổng Cục Chính trị",
                HCKT: "Văn bản Tổng Cục HC-KT"
            },
            QK: {
                BTL: "Văn bản BTL QK",
                BTM: "Văn bản Bộ Tham mưu QK",
                CCT: "Văn bản Cục Chính trị",
                CHC: "Văn bản Cục HC-KT"
            },
            SD: {
                SD: "Văn bản SĐ",
                PTM: "Văn bản PTM",
                PCT: "Văn bản PCT",
                PHCKT: "Văn bản Phòng HC-KT",
                OTHER: "Văn bản khác"
            }
        };

        const level3Items = ["Nghị quyết", "Quyết định", "Chỉ thị", "Quy định", "Chuyên đề", "Thông báo", "Văn bản khác"];

        let selectedL1 = 'HOME';
        let selectedL2 = '';
        let selectedL3 = '';
        let currentUser = null;

        window.onload = function() {
            switchLevel1('HOME');
        };

        function switchLevel1(l1) {
            selectedL1 = l1;
            selectedL3 = '';

            document.querySelectorAll('#level1Tabs .nav-link').forEach((btn, idx) => {
                btn.classList.toggle('active', 
                    (l1 === 'HOME' && idx === 0) || 
                    (l1 === 'BQP' && idx === 1) || 
                    (l1 === 'QK' && idx === 2) || 
                    (l1 === 'SD' && idx === 3)
                );
            });

            if (l1 === 'HOME') {
                document.getElementById('level2Container').innerHTML = '';
                document.getElementById('level3Container').innerHTML = '';
                selectedL2 = '';
            } else {
                if (structure[l1]) {
                    selectedL2 = Object.keys(structure[l1])[0];
                    renderLevel2();
                    renderLevel3();
                }
            }
            loadDocuments();
        }

        function renderLevel2() {
            const container = document.getElementById('level2Container');
            container.innerHTML = '';
            if (!structure[selectedL1]) return;

            Object.keys(structure[selectedL1]).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `btn btn-sm ${selectedL2 === key ? 'btn-danger' : 'btn-outline-dark'} me-1 mb-1 fw-bold`;
                btn.innerText = structure[selectedL1][key];
                btn.onclick = () => {
                    selectedL2 = key;
                    selectedL3 = '';
                    renderLevel2();
                    renderLevel3();
                    loadDocuments();
                };
                container.appendChild(btn);
            });
        }

        function renderLevel3() {
            const container = document.getElementById('level3Container');
            container.innerHTML = '';
            if (selectedL1 === 'HOME') return;

            const allBtn = document.createElement('button');
            allBtn.className = `btn btn-sm ${selectedL3 === '' ? 'btn-danger' : 'btn-outline-secondary'} me-1 mb-1`;
            allBtn.innerText = 'Tất cả loại VB';
            allBtn.onclick = () => {
                selectedL3 = '';
                renderLevel3();
                loadDocuments();
            };
            container.appendChild(allBtn);

            level3Items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `btn btn-sm ${selectedL3 === item ? 'btn-danger' : 'btn-outline-secondary'} me-1 mb-1`;
                btn.innerText = item;
                btn.onclick = () => {
                    selectedL3 = item;
                    renderLevel3();
                    loadDocuments();
                };
                container.appendChild(btn);
            });
        }

        async function loadDocuments(query = '') {
            const grid = document.getElementById('documentGrid');
            grid.innerHTML = '<div class="col-12 text-center text-secondary py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>Đang tải dữ liệu...</div>';

            let url = '/api/documents';
            if (query && query.trim() !== '') {
                url += `?q=${encodeURIComponent(query.trim())}`;
            } else if (selectedL1 !== 'HOME') {
                url += `?level1=${selectedL1}&level2=${selectedL2}&level3=${selectedL3}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';

                let docs = data.data || [];
                if (docs.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Không có văn bản nào phù hợp!</div>';
                    return;
                }

                if (selectedL1 === 'HOME' && (!query || query.trim() === '')) {
                    docs = docs.slice(0, 10);
                }

                docs.forEach(doc => {
                    const col = document.createElement('div');
                    col.className = 'col-12 col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card card-doc h-100 shadow-sm border">
                            <img src="${doc.thumbnail || 'https://images.unsplash.com/photo-1568667256549-094345857637?w=500'}" class="card-img-top thumb-img">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge bg-danger">${structure[doc.level1]?.[doc.level2] || 'Văn bản'}</span>
                                    <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${doc.effectiveDate || '---'}</small>
                                </div>
                                <h6 class="fw-bold text-dark text-truncate-2 mt-2" style="height: 42px;">${doc.title}</h6>
                                <p class="small text-secondary mb-0">Số VB: <strong>${doc.docNumber || 'Chưa rõ'}</strong></p>
                            </div>
                            <div class="card-footer bg-light border-0 d-flex justify-content-between align-items-center p-2">
                                <button class="btn btn-sm btn-danger fw-bold px-3" onclick="viewDoc('${doc._id}')"><i class="fa-solid fa-file-pdf me-1"></i>Xem tệp</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-12 text-center text-danger py-5">Lỗi kết nối máy chủ!</div>';
            }
        }

        function executeSearch() {
            const q = document.getElementById('searchInput').value;
            loadDocuments(q);
        }

        function viewDoc(id) {
            window.open(`/api/documents/${id}/file`, '_blank');
        }
    </script>
</body>
</html>
