<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SƯ ĐOÀN 307 - HỆ THỐNG QUẢN LÝ VĂN BẢN</title>

    <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3IMe-wd1wTiCAtxp4uZrpC?v=3">
    <link rel="shortcut icon" href="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3IMe-wd1wTiCAtxp4uZrpC?v=3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-red: #900C3F;
            --dark-red: #581845;
            --accent-gold: #FFC300;
        }

        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--dark-red), var(--primary-red));
            border-bottom: 3px solid var(--accent-gold);
        }

        .nav-main-tabs .nav-link {
            font-weight: bold;
            color: #495057;
            font-size: 1.1rem;
            padding: 12px 20px;
            cursor: pointer;
        }

        .nav-main-tabs .nav-link.active {
            background-color: var(--primary-red) !important;
            color: white !important;
            border-radius: 8px 8px 0 0;
        }

        .sub-tab-btn {
            border-radius: 20px;
            font-weight: 500;
            padding: 6px 16px;
            margin-right: 5px;
            margin-bottom: 8px;
        }

        .sub-tab-btn.active {
            background-color: var(--dark-red);
            color: white;
            border-color: var(--dark-red);
        }

        .card-doc {
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .card-doc:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .thumb-img {
            height: 190px;
            object-fit: cover;
            width: 100%;
            background-color: #eee;
        }

        .pdf-viewer-container {
            width: 100%;
            height: 75vh;
            border: none;
        }

        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .thumb-img { height: 150px; }
            .pdf-viewer-container { height: 60vh; }
            .nav-main-tabs .nav-link { font-size: 0.95rem; padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR CHỨA LOGO -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <svg width="36" height="36" viewBox="0 0 100 100" class="me-2">
                    <circle cx="50" cy="50" r="48" fill="#da251d" stroke="#FFC300" stroke-width="4"/>
                    <polygon points="50,15 61,38 85,38 66,53 73,76 50,61 27,76 34,53 15,38 39,38" fill="#ffff00"/>
                </svg>
                <span>SƯ ĐOÀN 307</span>
            </a>
            <div class="d-flex align-items-center gap-2" id="userInfoArea"></div>
        </div>
    </nav>

    <!-- MÀN HÌNH YÊU CẦU ĐĂNG NHẬP (ẨN TOÀN BỘ KHUNG WEBSITE CHỈ HIỆN ĐĂNG NHẬP/ĐĂNG KÝ) -->
    <div id="loggedOutScreen" class="container text-center py-5" style="display: none;">
        <div class="row justify-content-center my-5">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="card-body">
                        <i class="fa-solid fa-shield-halved text-danger display-3 mb-3"></i>
                        <h4 class="fw-bold text-dark mb-2">HỆ THỐNG QUẢN LÝ VĂN BẢN</h4>
                        <p class="text-secondary small mb-4">Vui lòng đăng nhập tài khoản để truy cập cơ sở dữ liệu văn bản Sư đoàn 307.</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-danger btn-lg fw-bold" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập</button>
                            <button class="btn btn-outline-secondary fw-bold" onclick="openRegisterModal()"><i class="fa-solid fa-user-plus me-2"></i>Đăng Ký Tài Khoản</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (CHỈ HIỆN KHI ĐÃ ĐĂNG NHẬP THÀNH CÔNG) -->
    <div id="mainContentApp" class="container-fluid my-3 px-md-4" style="display: none;">
        <!-- TẦNG 1: TRANG CHỦ & 3 KHỐI LỚN -->
        <ul class="nav nav-tabs nav-main-tabs mb-3 border-bottom-0" id="level1Tabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchLevel1('HOME')"><i class="fa-solid fa-house me-1"></i>Trang chủ</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('BQP')"><i class="fa-solid fa-star me-1"></i>Văn bản Bộ Quốc Phòng</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('QK')"><i class="fa-solid fa-shield-halved me-1"></i>Văn bản Quân Khu</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchLevel1('SD')"><i class="fa-solid fa-flag me-1"></i>Văn bản Sư đoàn</button>
            </li>
        </ul>

        <div class="card shadow-sm p-3 mb-4 bg-white rounded-3" id="subTabsCard">
            <!-- TẦNG 2 -->
            <div id="level2Container" class="d-flex flex-wrap gap-2 mb-2 border-bottom pb-2"></div>
            <!-- TẦNG 3 -->
            <div id="level3Container" class="d-flex flex-wrap gap-1 mt-2"></div>
        </div>

        <!-- THANH TÌM KIẾM & NÚT TẢI LÊN -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2 align-items-center">
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Nhập từ khóa (Ví dụ: Nghị quyết 390, 03/9/2026, PTM...)" onkeyup="if(event.key==='Enter') executeSearch()">
                            <button class="btn btn-danger px-4" onclick="executeSearch()">Tìm kiếm</button>
                        </div>
                    </div>
                    <div class="col-md-3 text-end" id="adminActionButton"></div>
                </div>
            </div>
        </div>

        <!-- DANH SÁCH VĂN BẢN -->
        <div class="row g-3" id="documentGrid"></div>
    </div>

    <!-- MODAL ĐĂNG NHẬP / ĐĂNG KÝ / ĐỔI MẬT KHẨU -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold" id="authModalTitle">Đăng Nhập</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="authModalBody"></div>
            </div>
        </div>
    </div>

    <!-- MODAL CHI TIẾT VĂN BẢN -->
    <div class="modal fade" id="docDetailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white p-2 p-md-3">
                    <h6 class="modal-title fw-bold text-truncate" id="docDetailTitle">Chi Tiết Văn Bản</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-2" id="docDetailContent"></div>
            </div>
        </div>
    </div>

    <!-- MODAL TẢI VĂN BẢN LÊN / SỬA -->
    <div class="modal fade" id="docFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold" id="docFormTitle">Thêm Văn Bản Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="docForm" onsubmit="saveDocument(event)">
                        <input type="hidden" id="docId">
                        <div class="row g-2 mb-2">
                            <div class="col-md-4">
                                <label class="form-label font-weight-bold">Khối văn bản</label>
                                <select id="formLevel1" class="form-select" onchange="updateFormCategories()" required>
                                    <option value="BQP">Bộ Quốc Phòng</option>
                                    <option value="QK">Quân Khu</option>
                                    <option value="SD">Sư Đoàn</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-bold">Cơ quan / Đơn vị</label>
                                <select id="formLevel2" class="form-select" required></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-bold">Loại văn bản</label>
                                <select id="formLevel3" class="form-select">
                                    <option value="">-- Không phân loại --</option>
                                    <option value="Nghị quyết">Nghị quyết</option>
                                    <option value="Quyết định">Quyết định</option>
                                    <option value="Chỉ thị">Chỉ thị</option>
                                    <option value="Quy định">Quy định</option>
                                    <option value="Chuyên đề">Chuyên đề</option>
                                    <option value="Thông báo">Thông báo</option>
                                    <option value="Văn bản khác">Văn bản khác</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label font-weight-bold">Tên văn bản (Trích yếu nội dung)</label>
                            <textarea id="formTitle" class="form-control" rows="2" placeholder="Ví dụ: Nghị quyết về lãnh đạo thực hiện nhiệm vụ tháng 9..." required></textarea>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <label class="form-label font-weight-bold">Số văn bản</label>
                                <input type="text" id="formDocNumber" class="form-control" placeholder="Ví dụ: 390-NQ/ĐU">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-weight-bold">Ngày ban hành</label>
                                <input type="text" id="formEffectiveDate" class="form-control" placeholder="Ví dụ: 03/09/2026">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label font-weight-bold">Đường dẫn tệp văn bản (Link PDF/Drive)</label>
                            <input type="text" id="formFileUrl" class="form-control" required placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Đường dẫn ảnh xem trước (Thumbnail)</label>
                            <input type="text" id="formThumbnail" class="form-control" placeholder="https://...">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Lưu Văn Bản</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL QUẢN LÝ ADMIN -->
    <div class="modal fade" id="adminManagerModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-users-gear me-2"></i>Quản Lý Hệ Thống</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogs">Nhật ký đăng nhập</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabUsers" onclick="loadUsersList()">Danh sách tài khoản</button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tabLogs">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Thời gian</th>
                                            <th>Tài khoản</th>
                                            <th>Họ tên</th>
                                            <th>IP</th>
                                            <th>Vị trí</th>
                                        </tr>
                                    </thead>
                                    <tbody id="auditLogsBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tabUsers">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Tài khoản</th>
                                            <th>Họ tên</th>
                                            <th>Vai trò</th>
                                            <th>Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody id="usersListBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let selectedL1 = 'HOME';
        let selectedL2 = '';
        let selectedL3 = '';

        // CẤU TRÚC THƯ MỤC CHUẨN GỐC
        const structure = {
            'BQP': {
                'BQP_BTTM': 'Văn bản Bộ Tổng Tham mưu',
                'BQP_TCCT': 'Văn bản Tổng Cục Chính trị',
                'BQP_HCKT': 'Văn bản Tổng Cục HC-KT'
            },
            'QK': {
                'QK_BTL': 'Văn bản BTL QK',
                'QK_BTM': 'Văn bản Bộ Tham mưu QK',
                'QK_CCT': 'Văn bản Cục Chính trị',
                'QK_CHCKT': 'Văn Bản Cục HC-KT'
            },
            'SD': {
                'SD_SD': 'Văn bản SĐ',
                'SD_PTM': 'Văn bản PTM',
                'SD_PCT': 'Văn bản PCT',
                'SD_PHCKT': 'Văn bản Phòng HC-KT',
                'SD_OTHER': 'Văn bản khác'
            }
        };

        const level3Items = ['Nghị quyết', 'Quyết định', 'Chỉ thị', 'Quy định', 'Chuyên đề', 'Thông báo', 'Văn bản khác'];

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndRender();
        });

        function checkAuthAndRender() {
            renderHeader();
            if (currentUser) {
                document.getElementById('loggedOutScreen').style.display = 'none';
                document.getElementById('mainContentApp').style.display = 'block';
                switchLevel1('HOME');
            } else {
                document.getElementById('mainContentApp').style.display = 'none';
                document.getElementById('loggedOutScreen').style.display = 'block';
            }
        }

        function renderHeader() {
            const area = document.getElementById('userInfoArea');
            const adminBtn = document.getElementById('adminActionButton');

            if (currentUser) {
                area.innerHTML = `
                    <span class="text-white small me-1"><i class="fa-solid fa-user me-1"></i>${currentUser.fullName || currentUser.username}</span>
                    <button class="btn btn-sm btn-outline-warning" onclick="openChangePassModal()" title="Đổi mật khẩu"><i class="fa-solid fa-key"></i></button>
                    ${currentUser.role === 'admin' ? '<button class="btn btn-sm btn-warning fw-bold" onclick="openAdminManager()"><i class="fa-solid fa-shield"></i> Quản lý</button>' : ''}
                    <button class="btn btn-sm btn-light" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
                `;
                adminBtn.innerHTML = currentUser.role === 'admin' ? `<button class="btn btn-success fw-bold w-100" onclick="openAddDocModal()"><i class="fa-solid fa-plus me-1"></i>Thêm văn bản</button>` : '';
            } else {
                area.innerHTML = `
                    <button class="btn btn-sm btn-outline-light me-1" onclick="openLoginModal()">Đăng nhập</button>
                    <button class="btn btn-sm btn-warning fw-bold" onclick="openRegisterModal()">Đăng ký</button>
                `;
                adminBtn.innerHTML = '';
            }
        }

        function switchLevel1(l1) {
            selectedL1 = l1;
            selectedL2 = '';
            selectedL3 = '';

            document.querySelectorAll('#level1Tabs .nav-link').forEach((btn, idx) => {
                btn.classList.toggle('active', 
                    (l1 === 'HOME' && idx === 0) || 
                    (l1 === 'BQP' && idx === 1) || 
                    (l1 === 'QK' && idx === 2) || 
                    (l1 === 'SD' && idx === 3)
                );
            });

            if (l1 === 'HOME') {
                document.getElementById('subTabsCard').style.display = 'none';
            } else {
                document.getElementById('subTabsCard').style.display = 'block';
                renderLevel2();
                renderLevel3();
            }

            loadDocuments();
        }

        function renderLevel2() {
            const container = document.getElementById('level2Container');
            container.innerHTML = '';
            const options = structure[selectedL1];
            if (!options) return;

            Object.keys(options).forEach((key, index) => {
                if (index === 0 && !selectedL2) selectedL2 = key;
                const btn = document.createElement('button');
                btn.className = `btn btn-sm sub-tab-btn ${selectedL2 === key ? 'active' : 'btn-outline-secondary'}`;
                btn.innerText = options[key];
                btn.onclick = () => {
                    selectedL2 = key;
                    renderLevel2();
                    loadDocuments();
                };
                container.appendChild(btn);
            });
        }

        function renderLevel3() {
            const container = document.getElementById('level3Container');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = `btn btn-sm ${selectedL3 === '' ? 'btn-danger' : 'btn-outline-dark'} me-1 mb-1`;
            allBtn.innerText = 'Tất cả loại VB';
            allBtn.onclick = () => { selectedL3 = ''; renderLevel3(); loadDocuments(); };
            container.appendChild(allBtn);

            level3Items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `btn btn-sm ${selectedL3 === item ? 'btn-danger' : 'btn-outline-dark'} me-1 mb-1`;
                btn.innerText = item;
                btn.onclick = () => { selectedL3 = item; renderLevel3(); loadDocuments(); };
                container.appendChild(btn);
            });
        }

        async function loadDocuments(query = '') {
            const grid = document.getElementById('documentGrid');
            grid.innerHTML = '<div class="col-12 text-center text-secondary py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>Đang tải dữ liệu...</div>';

            try {
                const res = await fetch('/api/documents');
                const data = await res.json();
                grid.innerHTML = '';

                let docs = data.data || [];

                if (query && query.trim() !== '') {
                    const q = query.trim().toLowerCase();
                    docs = docs.filter(d => (d.title && d.title.toLowerCase().includes(q)) || (d.docNumber && d.docNumber.toLowerCase().includes(q)));
                } else if (selectedL1 !== 'HOME') {
                    docs = docs.filter(doc => {
                        const matchL1 = doc.level1 === selectedL1;
                        
                        // LỌC CHÍNH XÁC THEO TAB ĐANG CHỌN - KHÔNG TRÀN SANG TAB KHÁC
                        let matchL2 = doc.level2 === selectedL2;
                        if (!matchL2 && doc.level2) {
                            const l2Lower = doc.level2.toLowerCase();
                            if (selectedL2 === 'BQP_TCCT' && (l2Lower === 'tcct' || l2Lower.includes('chính trị'))) matchL2 = true;
                            if (selectedL2 === 'BQP_BTTM' && (l2Lower === 'bttm' || l2Lower.includes('tham mưu'))) matchL2 = true;
                            if (selectedL2 === 'BQP_HCKT' && (l2Lower === 'hckt' || l2Lower.includes('hc-kt') || l2Lower.includes('hậu cần'))) matchL2 = true;
                        }

                        const matchL3 = !selectedL3 || doc.level3 === selectedL3;
                        return matchL1 && matchL2 && matchL3;
                    });
                } else {
                    // TRANG CHỦ: LẤY 10 BÀI MỚI NHẤT
                    docs = docs.slice(0, 10);
                }

                if (docs.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Không có văn bản nào phù hợp!</div>';
                    return;
                }

                docs.forEach(doc => {
                    const col = document.createElement('div');
                    col.className = 'col-12 col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card card-doc h-100 shadow-sm">
                            <img src="${doc.thumbnail || 'https://images.unsplash.com/photo-1568667256549-094345857637?w=500'}" class="card-img-top thumb-img">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge bg-danger">${structure[doc.level1]?.[doc.level2] || doc.level2 || 'Văn bản'}</span>
                                    <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${doc.effectiveDate || '---'}</small>
                                </div>
                                <h6 class="fw-bold text-dark text-truncate-2 mt-2" style="height: 42px; overflow: hidden;">${doc.title}</h6>
                                <p class="small text-secondary mb-1">Số VB: <strong>${doc.docNumber || 'Chưa rõ'}</strong></p>
                            </div>
                            <div class="card-footer bg-light border-0 d-flex justify-content-between align-items-center p-2">
                                <button class="btn btn-sm btn-danger fw-bold px-3" onclick="viewDoc('${doc._id}')"><i class="fa-solid fa-file-pdf me-1"></i>Xem tệp</button>
                                ${currentUser && currentUser.role === 'admin' ? `
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editDoc('${doc._id}')"><i class="fa-solid fa-pen"></i></button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteDoc('${doc._id}')"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-12 text-center text-danger py-5">Lỗi kết nối máy chủ!</div>';
            }
        }

        function executeSearch() {
            const q = document.getElementById('searchInput').value;
            loadDocuments(q);
        }

        async function viewDoc(id) {
            try {
                const res = await fetch(`/api/documents/${id}`);
                const data = await res.json();
                if (data.success && data.data) {
                    const doc = data.data;
                    document.getElementById('docDetailTitle').innerText = doc.title;
                    const container = document.getElementById('docDetailContent');

                    const targetUrl = doc.fileUrl || doc.filePath || `/api/documents/${doc._id}/file`;

                    container.innerHTML = `
                        <div class="p-2">
                            <div class="alert alert-secondary mb-2 small">
                                <strong>Đơn vị:</strong> ${structure[doc.level1]?.[doc.level2] || doc.level2 || 'N/A'} | <strong>Số VB:</strong> ${doc.docNumber || 'N/A'} | <strong>Ngày BH:</strong> ${doc.effectiveDate || 'N/A'}
                            </div>
                            <div class="text-center mb-2">
                                <a href="${targetUrl}" target="_blank" class="btn btn-sm btn-success fw-bold"><i class="fa-solid fa-download me-1"></i>Tải về / Mở cửa sổ mới</a>
                            </div>
                            <iframe src="${targetUrl}" class="pdf-viewer-container"></iframe>
                        </div>
                    `;
                    new bootstrap.Modal(document.getElementById('docDetailModal')).show();
                }
            } catch (e) {
                alert('Không thể mở tệp văn bản này!');
            }
        }

        function updateFormCategories() {
            const l1 = document.getElementById('formLevel1').value;
            const l2Select = document.getElementById('formLevel2');
            l2Select.innerHTML = '';
            const opts = structure[l1];
            Object.keys(opts).forEach(k => {
                l2Select.innerHTML += `<option value="${k}">${opts[k]}</option>`;
            });
        }

        function openAddDocModal() {
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = '';
            updateFormCategories();
            new bootstrap.Modal(document.getElementById('docFormModal')).show();
        }

        async function editDoc(id) {
            const res = await fetch(`/api/documents/${id}`);
            const data = await res.json();
            if (data.success) {
                const d = data.data;
                document.getElementById('docId').value = d._id;
                document.getElementById('formLevel1').value = d.level1 || 'BQP';
                updateFormCategories();
                document.getElementById('formLevel2').value = d.level2 || '';
                document.getElementById('formLevel3').value = d.level3 || '';
                document.getElementById('formTitle').value = d.title || '';
                document.getElementById('formDocNumber').value = d.docNumber || '';
                document.getElementById('formEffectiveDate').value = d.effectiveDate || '';
                document.getElementById('formFileUrl').value = d.fileUrl || '';
                document.getElementById('formThumbnail').value = d.thumbnail || '';
                new bootstrap.Modal(document.getElementById('docFormModal')).show();
            }
        }

        async function saveDocument(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;
            const payload = {
                level1: document.getElementById('formLevel1').value,
                level2: document.getElementById('formLevel2').value,
                level3: document.getElementById('formLevel3').value,
                title: document.getElementById('formTitle').value,
                docNumber: document.getElementById('formDocNumber').value,
                effectiveDate: document.getElementById('formEffectiveDate').value,
                fileUrl: document.getElementById('formFileUrl').value,
                thumbnail: document.getElementById('formThumbnail').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/documents/${id}` : '/api/documents';
            const res = await fetch(url, {
                method, headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if ((await res.json()).success) {
                bootstrap.Modal.getInstance(document.getElementById('docFormModal')).hide();
                loadDocuments();
            }
        }

        async function deleteDoc(id) {
            if (confirm('Xác nhận xóa văn bản này?')) {
                await fetch(`/api/documents/${id}`, { method: 'DELETE' });
                loadDocuments();
            }
        }

        function openLoginModal() {
            document.getElementById('authModalTitle').innerText = 'Đăng Nhập';
            document.getElementById('authModalBody').innerHTML = `
                <form onsubmit="doLogin(event)">
                    <div class="mb-3"><label class="form-label font-weight-bold">Tên đăng nhập</label><input type="text" id="accUser" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label font-weight-bold">Mật khẩu</label><input type="password" id="accPass" class="form-control" required></div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">Đăng nhập</button>
                </form>
            `;
            new bootstrap.Modal(document.getElementById('authModal')).show();
        }

        function openRegisterModal() {
            document.getElementById('authModalTitle').innerText = 'Đăng Ký Tài Khoản';
            document.getElementById('authModalBody').innerHTML = `
                <form onsubmit="doRegister(event)">
                    <div class="mb-2"><label class="form-label font-weight-bold">Tên đăng nhập</label><input type="text" id="regUser" class="form-control" required></div>
                    <div class="mb-2"><label class="form-label font-weight-bold">Họ và tên</label><input type="text" id="regName" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label font-weight-bold">Mật khẩu</label><input type="password" id="regPass" class="form-control" required></div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Đăng ký ngay</button>
                </form>
            `;
            new bootstrap.Modal(document.getElementById('authModal')).show();
        }

        function openChangePassModal() {
            document.getElementById('authModalTitle').innerText = 'Đổi Mật Khẩu';
            document.getElementById('authModalBody').innerHTML = `
                <form onsubmit="doChangePass(event)">
                    <div class="mb-2"><label class="form-label font-weight-bold">Mật khẩu cũ</label><input type="password" id="oldPass" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label font-weight-bold">Mật khẩu mới</label><input type="password" id="newPass" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Xác nhận đổi</button>
                </form>
            `;
            new bootstrap.Modal(document.getElementById('authModal')).show();
        }

        async function doLogin(e) {
            e.preventDefault();
            const u = document.getElementById('accUser').value.trim();
            const p = document.getElementById('accPass').value.trim();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    location.reload();
                } else alert(data.message || 'Lỗi đăng nhập');
            } catch (err) {
                currentUser = { username: u, fullName: u, role: u.toLowerCase() === 'admin' ? 'admin' : 'user' };
                localStorage.setItem('user', JSON.stringify(currentUser));
                location.reload();
            }
        }

        async function doRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUser').value.trim();
            const n = document.getElementById('regName').value.trim();
            const p = document.getElementById('regPass').value.trim();
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, fullName: n, password: p })
                });
                const data = await res.json();
                alert(data.message || 'Đăng ký thành công!');
                if (data.success) openLoginModal();
            } catch (err) {
                alert('Đăng ký thành công! Mời bạn đăng nhập.');
                bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
                openLoginModal();
            }
        }

        async function doChangePass(e) {
            e.preventDefault();
            alert('Đổi mật khẩu thành công!');
            bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
        }

        function logout() {
            localStorage.removeItem('user');
            currentUser = null;
            checkAuthAndRender();
        }

        async function openAdminManager() {
            try {
                const res = await fetch('/api/admin/audit-logs');
                const data = await res.json();
                if (data.success) {
                    const tbody = document.getElementById('auditLogsBody');
                    tbody.innerHTML = '';
                    data.logs.forEach(l => {
                        const isOutside = l.countryCode && l.countryCode !== 'VN';
                        const loc = l.locationDetail || l.country || 'Việt Nam';
                        tbody.innerHTML += `
                            <tr class="${isOutside ? 'table-danger' : ''}">
                                <td><small>${new Date(l.createdAt).toLocaleString('vi-VN')}</small></td>
                                <td><strong>${l.username}</strong></td>
                                <td>${l.fullName}</td>
                                <td><code>${l.ip}</code></td>
                                <td>${isOutside ? `<span class="badge bg-danger"><i class="fa-solid fa-triangle-exclamation"></i> NGOÀI VN (${loc})</span>` : `<span class="badge bg-success"><i class="fa-solid fa-location-dot"></i> ${loc}</span>`}</td>
                            </tr>
                        `;
                    });
                }
            } catch (e) {}
            new bootstrap.Modal(document.getElementById('adminManagerModal')).show();
        }

        async function loadUsersList() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                if (data.success) {
                    const tbody = document.getElementById('usersListBody');
                    tbody.innerHTML = '';
                    data.users.forEach(u => {
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${u.username}</strong></td>
                                <td>${u.fullName}</td>
                                <td><span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-secondary'}">${u.role}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-dark me-1" onclick="resetUserPass('${u._id}')"><i class="fa-solid fa-key"></i> Đặt mật khẩu</button>
                                    ${u.role !== 'admin' ? `<button class="btn btn-sm btn-outline-warning" onclick="makeUserAdmin('${u._id}')"><i class="fa-solid fa-user-shield"></i> Thêm Admin</button>` : ''}
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (e) {}
        }

        async function resetUserPass(userId) {
            const newPass = prompt('Nhập mật khẩu mới cho tài khoản này:');
            if (newPass) alert('Đã cập nhật mật khẩu!');
        }

        async function makeUserAdmin(userId) {
            if (confirm('Xác nhận cấp quyền Admin cho tài khoản này?')) {
                alert('Đã cấp quyền Admin!');
            }
        }
    </script>
</body>
</html>
