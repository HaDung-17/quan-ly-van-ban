<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Văn Bản - Sư Đoàn 307</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-role { width: auto; padding: 5px 10px; font-size: 12px; }
        .admin-badge { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ Thống Quản Lý Văn Bản - Sư Đoàn 307</h2>

    <!-- Form Đăng Nhập / Đăng Ký -->
    <div id="auth-box">
        <h3 id="form-title">Đăng Nhập</h3>
        <input type="text" id="username" placeholder="Tên đăng nhập">
        <input type="password" id="password" placeholder="Mật khẩu">
        <input type="text" id="fullname" placeholder="Họ và tên (chỉ dùng khi đăng ký)" class="hidden">
        <button id="btn-submit" onclick="login()">Đăng Nhập</button>
        <p style="text-align: center;">
            <a href="#" id="toggle-link" onclick="toggleMode()">Chưa có tài khoản? Đăng ký ngay</a>
        </p>
    </div>

    <!-- Màn hình sau khi đăng nhập -->
    <div id="main-box" class="hidden">
        <h3>Xin chào: <span id="user-display"></span> (<span id="role-display"></span>)</h3>
        <button onclick="logout()" style="background-color: #dc3545; width: auto;">Đăng xuất</button>

        <!-- Khu vực Quản lý Thành viên cho Admin -->
        <div id="admin-section" class="hidden">
            <hr>
            <h4>Danh Sách Thành Viên & Phân Quyền Admin</h4>
            <table>
                <thead>
                    <tr>
                        <th>Tên Đăng Nhập</th>
                        <th>Họ Tên</th>
                        <th>Chức Vụ</th>
                        <th>IP Đăng Nhập</th>
                        <th>Thao Tác Admin</th>
                    </tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let isRegisterMode = false;
    let currentUser = null;

    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('form-title').innerText = isRegisterMode ? 'Đăng Ký Tài Khoản' : 'Đăng Nhập';
        document.getElementById('fullname').classList.toggle('hidden', !isRegisterMode);
        document.getElementById('btn-submit').innerText = isRegisterMode ? 'Đạo Tài Khoản' : 'Đăng Nhập';
        document.getElementById('toggle-link').innerText = isRegisterMode ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký ngay';
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const fullname = document.getElementById('fullname').value;

        const endpoint = isRegisterMode ? '/api/register' : '/api/login';
        const payload = isRegisterMode ? { username, password, fullname } : { username, password };

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        alert(data.message);

        if (res.ok) {
            if (isRegisterMode) {
                toggleMode();
            } else {
                currentUser = data.user;
                showMainScreen();
            }
        }
    }

    function showMainScreen() {
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('main-box').classList.remove('hidden');
        document.getElementById('user-display').innerText = currentUser.fullname || currentUser.username;
        document.getElementById('role-display').innerText = currentUser.role;

        if (currentUser.role === 'admin') {
            document.getElementById('admin-section').classList.remove('hidden');
            loadUsers();
        }
    }

    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = '';

        users.forEach(u => {
            const isSelf = u.id === currentUser.id;
            const actionBtn = u.role === 'admin' 
                ? `<button class="btn-role" style="background:#6c757d;" ${isSelf ? 'disabled' : ''} onclick="changeRole('${u.id}', 'user')">Hạ xuống User</button>`
                : `<button class="btn-role" style="background:#28a745;" onclick="changeRole('${u.id}', 'admin')">Thăng làm Admin</button>`;

            tbody.innerHTML += `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.fullname || '-'}</td>
                    <td><span class="${u.role === 'admin' ? 'admin-badge' : ''}">${u.role}</span></td>
                    <td>${u.lastIp || u.ip || 'N/A'}</td>
                    <td>${actionBtn}</td>
                </tr>
            `;
        });
    }

    async function changeRole(userId, newRole) {
        if (!confirm(`Bạn có chắc muốn chuyển quyền tài khoản này thành ${newRole}?`)) return;

        const res = await fetch('/api/admin/change-role', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, newRole })
        });

        const data = await res.json();
        alert(data.message);
        if (res.ok) loadUsers();
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
