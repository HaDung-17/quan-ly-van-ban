<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SƯ ĐOÀN 307 - QUẢN LÝ VĂN BẢN</title>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3lMe-wd1wTIcATxp4uzrpc">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3lMe-wd1wTIcATxp4uzrpc">
    <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3lMe-wd1wTIcATxp4uzrpc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sư Đoàn 307">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-red: #900C3F;
            --dark-red: #581845;
            --accent-gold: #FFC300;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--dark-red), var(--primary-red));
            border-bottom: 3px solid var(--accent-gold);
        }

        .card-doc {
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e0e0e0;
        }

        .card-doc:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .badge-cat {
            background-color: var(--primary-red);
            color: white;
        }

        .sidebar-menu .list-group-item {
            border: none;
            padding: 10px 15px;
            font-weight: 500;
        }

        .sidebar-menu .list-group-item.active {
            background-color: var(--primary-red);
            border-color: var(--primary-red);
        }

        .pdf-viewer-container {
            width: 100%;
            height: 80vh;
            border: none;
        }

        .thumb-img {
            height: 180px;
            object-fit: cover;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <img src="https://lh3.googleusercontent.com/d/1KTHtnYQ6PT3lMe-wd1wTIcATxp4uzrpc" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2 rounded-circle border border-warning">
                SƯ ĐOÀN 307 - HỆ THỐNG VĂN BẢN
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-brand navbar-nav me-auto"></ul>
                <div class="d-flex align-items-center gap-2" id="userInfoArea">
                    <!-- Javascript sẽ đổ thông tin user/đăng nhập vào đây -->
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTAINER CHÍNH -->
    <div class="container-fluid my-4">
        <div class="row">
            <!-- SIDEBAR DÀNH CHO BỘ LỌC CATEGORY -->
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm mb-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-filter me-2"></i>DANH MỤC VĂN BẢN
                    </div>
                    <div class="card-body p-2">
                        <div class="list-group sidebar-menu" id="categoryTree">
                            <button class="list-group-item list-group-item-action active" onclick="filterByCat('ALL')">
                                <i class="fa-solid fa-layer-group me-2"></i>Tất cả văn bản
                            </button>
                            <button class="list-group-item list-group-item-action" onclick="filterByCat('QS')">
                                <i class="fa-solid fa-shield-halved me-2"></i>Quân sự
                            </button>
                            <button class="list-group-item list-group-item-action" onclick="filterByCat('CT')">
                                <i class="fa-solid fa-flag me-2"></i>Chính trị
                            </button>
                            <button class="list-group-item list-group-item-action" onclick="filterByCat('HC')">
                                <i class="fa-solid fa-truck-medical me-2"></i>Hậu cần
                            </button>
                            <button class="list-group-item list-group-item-action" onclick="filterByCat('KT')">
                                <i class="fa-solid fa-wrench me-2"></i>Kỹ thuật
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- NỘI DUNG CHÍNH (TÌM KIẾM & DANH SÁCH VĂN BẢN) -->
            <div class="col-md-9">
                <!-- THANH TÌM KIẾM & NÚT THÊM MỚI -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-8">
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="text" id="searchInput" class="form-control" placeholder="Nhập từ khóa tìm kiếm (Tên văn bản, số hiệu, trích yếu...)" onkeyup="handleSearch(event)">
                                    <button class="btn btn-danger" onclick="executeSearch()">Tìm kiếm</button>
                                </div>
                            </div>
                            <div class="col-md-4 text-end" id="adminActionButton">
                                <!-- Nút thêm văn bản dành cho Admin -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- LƯỚI DANH SÁCH VĂN BẢN -->
                <div class="row g-3" id="documentGrid">
                    <!-- JavaScript sẽ đổ dữ liệu văn bản vào đây -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i>ĐĂNG NHẬP HỆ THỐNG</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Tên đăng nhập</label>
                            <input type="text" id="loginUsername" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Mật khẩu</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>
                        <div id="loginError" class="text-danger mb-3 small" style="display:none;"></div>
                        <button type="submit" class="btn btn-danger w-100">Đăng nhập</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL XEM CHI TIẾT VĂN BẢN & PDF -->
    <div class="modal fade" id="docDetailModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="docDetailTitle">Chi tiết Văn bản</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="docDetailContent">
                    <!-- Đổ nội dung file PDF/Ảnh ở đây -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA VĂN BẢN -->
    <div class="modal fade" id="docFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold" id="docFormTitle">Thêm Văn Bản Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="docForm" onsubmit="saveDocument(event)">
                        <input type="hidden" id="docId">
                        <div class="row g-2 mb-2">
                            <div class="col-md-4">
                                <label class="form-label">Ngành (Chính)</label>
                                <select id="formMainCat" class="form-select" required>
                                    <option value="QS">Quân sự</option>
                                    <option value="CT">Chính trị</option>
                                    <option value="HC">Hậu cần</option>
                                    <option value="KT">Kỹ thuật</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Danh mục phụ</label>
                                <input type="text" id="formSubCat" class="form-control" placeholder="Ví dụ: Tác chiến, Cán bộ...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cấp chi tiết</label>
                                <input type="text" id="formChildCat" class="form-control" placeholder="Ví dụ: Sẵn sàng chiến đấu...">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Tên / Têu đề văn bản</label>
                            <input type="text" id="formTitle" class="form-control" required>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-md-4">
                                <label class="form-label">Số / Ký hiệu</label>
                                <input type="text" id="formDocNumber" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ngày ban hành</label>
                                <input type="date" id="formEffectiveDate" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cơ quan ban hành</label>
                                <input type="text" id="formIssuer" class="form-control">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Trích yếu nội dung</label>
                            <textarea id="formSummary" class="form-rows-3 form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Đường dẫn file văn bản (Google Drive, Cloud...)</label>
                            <input type="text" id="formFileUrl" class="form-control" placeholder="https://..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Đường dẫn Ảnh Xem Trước (Thumbnail)</label>
                            <input type="text" id="formThumbnail" class="form-control" placeholder="https://...">
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Lưu Văn Bản</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NHẬT KÝ ĐĂNG NHẬP (AUDIT LOGS) -->
    <div class="modal fade" id="auditLogsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-clock-rotate-left me-2"></i>Nhật Ký Đăng Nhập</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Tài khoản</th>
                                    <th>Họ tên</th>
                                    <th>Địa chỉ IP</th>
                                    <th>Vị trí đăng nhập</th>
                                </tr>
                            </thead>
                            <tbody id="auditLogsTableBody">
                                <!-- Đổ dữ liệu nhật ký vào đây -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let currentCat = 'ALL';

        document.addEventListener('DOMContentLoaded', () => {
            renderHeader();
            loadDocuments();
        });

        function renderHeader() {
            const area = document.getElementById('userInfoArea');
            const adminBtnArea = document.getElementById('adminActionButton');

            if (currentUser) {
                area.innerHTML = `
                    <span class="text-white me-2"><i class="fa-solid fa-user-check me-1"></i><sup>${currentUser.fullName}</sup></span>
                    ${currentUser.role === 'admin' ? '<button class="btn btn-warning btn-sm me-2" onclick="showAuditLogsModal()"><i class="fa-solid fa-shield me-1"></i>Nhật ký</button>' : ''}
                    <button class="btn btn-outline-light btn-sm" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket me-1"></i>Đăng xuất</button>
                `;
                if (currentUser.role === 'admin') {
                    adminBtnArea.innerHTML = `<button class="btn btn-success" onclick="openAddDocModal()"><i class="fa-solid fa-plus me-1"></i>Thêm văn bản</button>`;
                } else {
                    adminBtnArea.innerHTML = '';
                }
            } else {
                area.innerHTML = `
                    <button class="btn btn-outline-light btn-sm" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket me-1"></i>Đăng nhập</button>
                `;
                adminBtnArea.innerHTML = '';
            }
        }

        function openLoginModal() {
            new bootstrap.Modal(document.getElementById('loginModal')).show();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                location.reload();
            } else {
                const errDiv = document.getElementById('loginError');
                errDiv.innerText = data.message;
                errDiv.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('user');
            location.reload();
        }

        async function loadDocuments(query = '') {
            let url = `/api/documents?q=${encodeURIComponent(query)}`;
            if (currentCat !== 'ALL') {
                url += `&mainCat=${currentCat}`;
            }

            const res = await fetch(url);
            const data = await res.json();

            const grid = document.getElementById('documentGrid');
            grid.innerHTML = '';

            if (!data.data || data.data.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Không tìm thấy văn bản phù hợp!</div>';
                return;
            }

            data.data.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'col-md-4';
                card.innerHTML = `
                    <div class="card card-doc h-100">
                        <img src="${doc.thumbnail || 'https://via.placeholder.com/300x180?text=VAN+BAN'}" class="card-img-top thumb-img">
                        <div class="card-body">
                            <span class="badge badge-cat mb-2">${doc.mainCat || 'Chung'}</span>
                            <h6 class="card-title fw-bold text-dark text-truncate">${doc.title}</h6>
                            <p class="card-text small text-muted mb-1">Số/KH: <strong>${doc.docNumber || 'Chưa rõ'}</strong></p>
                            <p class="card-text small text-muted">Ngày BH: ${doc.effectiveDate || '---'}</p>
                        </div>
                        <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                            <button class="btn btn-sm btn-outline-danger" onclick="viewDoc('${doc._id}')"><i class="fa-solid fa-eye me-1"></i>Xem văn bản</button>
                            ${currentUser && currentUser.role === 'admin' ? `
                                <div>
                                    <button class="btn btn-sm btn-link text-primary p-0 me-2" onclick="editDoc('${doc._id}')"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteDoc('${doc._id}')"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('#categoryTree .list-group-item').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadDocuments();
        }

        function handleSearch(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function executeSearch() {
            const q = document.getElementById('searchInput').value;
            loadDocuments(q);
        }

        async function viewDoc(id) {
            const res = await fetch(`/api/documents/${id}`);
            const data = await res.json();

            if (data.success && data.data) {
                const doc = data.data;
                document.getElementById('docDetailTitle').innerText = doc.title;
                const container = document.getElementById('docDetailContent');

                if (doc.fileUrl.endsWith('.pdf')) {
                    container.innerHTML = `<iframe src="${doc.fileUrl}" class="pdf-viewer-container"></iframe>`;
                } else {
                    container.innerHTML = `
                        <div class="text-center p-3">
                            <p>${doc.summary || 'Không có trích yếu nội dung'}</p>
                            <a href="${doc.fileUrl}" target="_blank" class="btn btn-danger"><i class="fa-solid fa-download me-2"></i>Mở/Tải File Văn Bản</a>
                        </div>
                    `;
                }

                new bootstrap.Modal(document.getElementById('docDetailModal')).show();
            }
        }

        function openAddDocModal() {
            document.getElementById('docForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('docFormTitle').innerText = 'Thêm Văn Bản Mới';
            new bootstrap.Modal(document.getElementById('docFormModal')).show();
        }

        async function saveDocument(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;

            const payload = {
                mainCat: document.getElementById('formMainCat').value,
                subCat: document.getElementById('formSubCat').value,
                childCat: document.getElementById('formChildCat').value,
                title: document.getElementById('formTitle').value,
                docNumber: document.getElementById('formDocNumber').value,
                effectiveDate: document.getElementById('formEffectiveDate').value,
                issuer: document.getElementById('formIssuer').value,
                summary: document.getElementById('formSummary').value,
                fileUrl: document.getElementById('formFileUrl').value,
                thumbnail: document.getElementById('formThumbnail').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/documents/${id}` : '/api/documents';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('docFormModal')).hide();
                loadDocuments();
            }
        }

        async function deleteDoc(id) {
            if (confirm('Bạn có chắc chắn muốn xóa văn bản này?')) {
                await fetch(`/api/documents/${id}`, { method: 'DELETE' });
                loadDocuments();
            }
        }

        // Admin Audit Logs - Hiển thị vị trí đầy đủ nhất
        async function showAuditLogsModal() {
            const res = await fetch('/api/admin/audit-logs');
            const data = await res.json();
            if (data.success) {
                const tbody = document.getElementById('auditLogsTableBody');
                tbody.innerHTML = '';
                data.logs.forEach(l => {
                    const isOutsideVN = l.countryCode && l.countryCode !== 'VN';
                    const displayLoc = l.locationDetail || l.country || 'Chưa xác định';
                    const tr = document.createElement('tr');
                    if (isOutsideVN) tr.className = 'table-danger';
                    tr.innerHTML = `
                        <td><small>${new Date(l.createdAt).toLocaleString('vi-VN')}</small></td>
                        <td><strong>${l.username}</strong></td>
                        <td>${l.fullName}</td>
                        <td><code>${l.ip}</code></td>
                        <td>
                            ${isOutsideVN ? `<span class="badge bg-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i> NGOÀI VIỆT NAM (${displayLoc})</span>` : `<span class="badge bg-success"><i class="fa-solid fa-location-dot me-1"></i> ${displayLoc}</span>`}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                new bootstrap.Modal(document.getElementById('auditLogsModal')).show();
            }
        }
    </script>
</body>
</html>
